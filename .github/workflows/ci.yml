name: RDS offline verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: /tmp/rds-matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install project and verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test,server]'

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run offline test suite
        run: python -m pytest -q

      - name: Validate production server configuration
        run: gunicorn --check-config flask_app.run:app
